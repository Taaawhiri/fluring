name: Release APK

# Tagging is the release trigger; workflow_dispatch is there so a build can be
# retried without inventing a new tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Catching a break here costs a minute; catching it after the release is
      # published costs a re-tag.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Configure release signing
        # Without a keystore secret the build still succeeds using debug keys,
        # but the APK cannot upgrade a previous install. Warn rather than fail,
        # so a first run works before the secrets are set up.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret; signing with debug keys. This APK will not be able to upgrade an existing install."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          # storeFile is resolved relative to the app module, hence the bare name.
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Resolve version
        id: name
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0"
          fi
          echo "name=${version}" >> "$GITHUB_OUTPUT"
          echo "apk=fluring-${GITHUB_REF_NAME}.apk" >> "$GITHUB_OUTPUT"

      # The build number must climb with every release: Android refuses to
      # install an APK whose versionCode is lower than the installed one, and
      # run_number only ever increases.
      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name "${{ steps.name.outputs.name }}" \
            --build-number "${{ github.run_number }}"
          mv build/app/outputs/flutter-apk/app-release.apk \
            "${{ steps.name.outputs.apk }}"

      # A manual run has no tag to attach a release to, so it leaves the APK as
      # a workflow artifact instead.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.apk }}
          path: ${{ steps.name.outputs.apk }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.name.outputs.apk }}" \
            --title "Fluring $GITHUB_REF_NAME" \
            --generate-notes
