name: Release APK

on:
  # Tagging is the usual release path.
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  # Lets a release be cut from the GitHub UI, without a local checkout: give a
  # version and the job tags the commit itself. Leave it blank to just build.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v0.1.0. Leave empty to build only.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Catching a break here costs a minute; catching it after the release is
      # published costs a re-tag.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Configure release signing
        # Without a keystore secret the build still succeeds using debug keys,
        # but the APK cannot upgrade a previous install. Warn rather than fail,
        # so a first run works before the secrets are set up.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret; signing with debug keys. This APK will not be able to upgrade an existing install."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          # storeFile is resolved relative to the app module, hence the bare name.
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Resolve version
        id: version
        run: |
          tag="${{ inputs.version }}"
          if [ -z "$tag" ] && [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            tag="$GITHUB_REF_NAME"
          fi
          # --build-name must be a bare x.y.z, so strip the leading "v".
          name="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "name=${name:-0.0.0}" >> "$GITHUB_OUTPUT"
          echo "apk=fluring-${tag:-$(git rev-parse --short HEAD)}.apk" >> "$GITHUB_OUTPUT"

      # The build number must climb with every release: Android refuses to
      # install an APK whose versionCode is lower than the installed one, and
      # run_number only ever increases.
      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ github.run_number }}"
          mv build/app/outputs/flutter-apk/app-release.apk \
            "${{ steps.version.outputs.apk }}"

      # Every run keeps the APK downloadable, release or not — this is also how
      # a plain branch build gets verified end to end.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk }}
          path: ${{ steps.version.outputs.apk }}

      - name: Publish release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # --target lets gh create the tag itself when the run was dispatched
          # manually rather than triggered by an existing tag.
          gh release create "$TAG" "${{ steps.version.outputs.apk }}" \
            --target "$GITHUB_SHA" \
            --title "Fluring $TAG" \
            --generate-notes
